<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Gym - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-teal-50 via-white to-emerald-50 min-h-screen">
    <!-- Header -->
    <header class="bg-gradient-to-r from-teal-600 to-emerald-600 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex justify-between items-center">
                <h1 class="text-2xl font-bold">🏋️ Gym Finder Admin</h1>
                <div class="flex items-center gap-4">
                    <!-- User Dropdown -->
                    <div class="relative" id="user-menu-container">
                        <button 
                            id="user-menu-button"
                            class="text-teal-100 hover:text-white px-4 py-2 rounded-lg font-semibold hover:bg-teal-700 transition cursor-pointer flex items-center gap-2"
                            onclick="toggleUserMenu()"
                        >
                            <span>Welcome, {{ current_user.name }}</span>
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                            </svg>
                        </button>
                        <div 
                            id="user-menu-dropdown"
                            class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl border border-teal-200 py-2 z-50"
                        >
                            <a 
                                href="http://localhost:5173/" 
                                class="block px-4 py-2 text-gray-700 hover:bg-teal-50 transition"
                            >
                                Return to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-white shadow-md border-b border-teal-100">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex space-x-8">
                <a href="/admin/dashboard" class="text-gray-500 hover:text-gray-700 hover:border-teal-300 border-b-2 border-transparent py-4 px-1 font-medium">
                    Dashboard
                </a>
                <a href="/admin/gyms" class="border-b-2 border-teal-600 text-teal-600 py-4 px-1 font-medium">
                    Gyms
                </a>
                <a href="/admin/users" class="text-gray-500 hover:text-gray-700 hover:border-teal-300 border-b-2 border-transparent py-4 px-1 font-medium">
                    Users
                </a>
                <a href="/admin/contact-messages" class="text-gray-500 hover:text-gray-700 hover:border-teal-300 border-b-2 border-transparent py-4 px-1 font-medium">
                    Contact Messages
                </a>
                <a href="/admin/statistics" class="text-gray-500 hover:text-teal-700 hover:border-teal-300 border-b-2 border-transparent py-4 px-1 font-medium">
                    Statistics
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-bold text-gray-900">Edit Gym</h2>
            <div class="flex gap-4">
                <button type="submit" form="gym-edit-form"
                    class="bg-teal-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-teal-700 transition">
                    Update Gym
                </button>
                <a href="/admin/gyms/{{ gym.id }}" 
                    class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg font-semibold hover:bg-gray-300 transition">
                    Cancel
                </a>
            </div>
        </div>

        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
            {{ error }}
        </div>
        {% endif %}

        <form id="gym-edit-form" method="POST" action="/admin/gyms/{{ gym.id }}/edit" class="bg-white rounded-lg shadow-md p-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                <div>
                    <label for="name_ar" class="block text-sm font-medium text-gray-700 mb-2">Arabic Name *</label>
                    <input type="text" id="name_ar" name="name_ar" value="{{ gym.name_ar }}" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                </div>
                <div>
                    <label for="name_en" class="block text-sm font-medium text-gray-700 mb-2">English Name *</label>
                    <input type="text" id="name_en" name="name_en" value="{{ gym.name_en }}" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                </div>
                <div>
                    <label for="gender" class="block text-sm font-medium text-gray-700 mb-2">Gender</label>
                    <select id="gender" name="gender"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                        <option value="">Select...</option>
                        <option value="Male" {% if gym.gender == "Men" or gym.gender == "Male" %}selected{% endif %}>Male</option>
                        <option value="Female" {% if gym.gender == "Women" or gym.gender == "Female" %}selected{% endif %}>Female</option>
                    </select>
                </div>
                <div>
                    <label for="district" class="block text-sm font-medium text-gray-700 mb-2">District *</label>
                    <input type="text" id="district" name="district" value="{{ gym.district }}" required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                </div>
                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
                    <input type="text" id="phone" name="phone" value="{{ gym.phone or '' }}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                </div>
                <div>
                    <label for="website" class="block text-sm font-medium text-gray-700 mb-2">Website</label>
                    <input type="text" id="website" name="website" value="{{ gym.website or '' }}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                </div>
                <div>
                    <label for="logo_url" class="block text-sm font-medium text-gray-700 mb-2">Image URL</label>
                    <input type="url" id="logo_url" name="logo_url" value="{{ gym.logo_url or '' }}"
                        placeholder="https://example.com/image.jpg"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                </div>
                <div>
                    <label for="rating" class="block text-sm font-medium text-gray-700 mb-2">Rating</label>
                    <input type="number" step="0.1" id="rating" name="rating" min="0" max="5" value="{{ gym.rating or '' }}"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                </div>
                <div>
                    <label for="opening_hours" class="block text-sm font-medium text-gray-700 mb-2">Opening Hours</label>
                    <input type="text" id="opening_hours" name="opening_hours" value="{{ gym.opening_hours or '' }}" 
                        placeholder="e.g., 6:00 AM - 11:00 PM"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">
                </div>
                <div class="md:col-span-2">
                    <label for="description" class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                    <textarea id="description" name="description" rows="4"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent">{{ gym.description or '' }}</textarea>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-3">Facilities</label>
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 max-h-60 overflow-y-auto border border-gray-200 rounded-lg p-4">
                        {% for facility in all_facilities %}
                        <label class="flex items-center space-x-2 cursor-pointer hover:bg-gray-50 p-2 rounded">
                            <input type="checkbox" name="facilities" value="{{ facility.id }}"
                                {% if gym.facilities %}
                                    {% for gym_facility in gym.facilities %}
                                        {% if gym_facility.id == facility.id %}checked{% endif %}
                                    {% endfor %}
                                {% endif %}
                                class="w-4 h-4 text-teal-600 border-gray-300 rounded focus:ring-teal-500">
                            <span class="text-sm text-gray-700">{{ facility.name_en }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </div>
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-3">Equipment</label>
                    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 max-h-60 overflow-y-auto border border-gray-200 rounded-lg p-4">
                        {% for equip in all_equipment %}
                        <label class="flex items-center space-x-2 cursor-pointer hover:bg-gray-50 p-2 rounded">
                            <input type="checkbox" name="equipment" value="{{ equip.id }}"
                                {% if gym.equipment %}
                                    {% for gym_equip in gym.equipment %}
                                        {% if gym_equip.id == equip.id %}checked{% endif %}
                                    {% endfor %}
                                {% endif %}
                                class="w-4 h-4 text-teal-600 border-gray-300 rounded focus:ring-teal-500">
                            <span class="text-sm text-gray-700">{{ equip.name_en }}</span>
                        </label>
                        {% endfor %}
                    </div>
                </div>
            </div>
        </form>
    </main>
    
    <script>
    let userMenuOpen = false;

    function toggleUserMenu() {
        const dropdown = document.getElementById('user-menu-dropdown');
        userMenuOpen = !userMenuOpen;
        if (userMenuOpen) {
            dropdown.classList.remove('hidden');
        } else {
            dropdown.classList.add('hidden');
        }
    }

    // Close menu when clicking outside
    document.addEventListener('click', function(event) {
        const container = document.getElementById('user-menu-container');
        const dropdown = document.getElementById('user-menu-dropdown');
        
        if (container && !container.contains(event.target)) {
            dropdown.classList.add('hidden');
            userMenuOpen = false;
        }
    });
    </script>
</body>
</html>
