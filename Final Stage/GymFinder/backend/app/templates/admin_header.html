<!-- Admin Header Component -->
<header class="bg-gradient-to-r from-teal-600 to-emerald-600 text-white shadow-lg">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
        <div class="flex justify-between items-center">
            <h1 class="text-2xl font-bold">🏋️ Gym Finder Admin{% if page_title %} - {{ page_title }}{% endif %}</h1>
            <div class="flex items-center gap-4">
                <!-- User Dropdown -->
                <div class="relative" id="user-menu-container">
                    <button 
                        id="user-menu-button"
                        class="text-teal-100 hover:text-white px-4 py-2 rounded-lg font-semibold hover:bg-teal-700 transition cursor-pointer flex items-center gap-2"
                        onclick="toggleUserMenu()"
                    >
                        <span>Welcome, {{ current_user.name }}</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div 
                        id="user-menu-dropdown"
                        class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-xl border border-teal-200 py-2 z-50"
                    >
                        <a 
                            href="http://localhost:5173/" 
                            class="block px-4 py-2 text-gray-700 hover:bg-teal-50 transition"
                        >
                            Return to Home
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<script>
let userMenuOpen = false;

function toggleUserMenu() {
    const dropdown = document.getElementById('user-menu-dropdown');
    userMenuOpen = !userMenuOpen;
    if (userMenuOpen) {
        dropdown.classList.remove('hidden');
    } else {
        dropdown.classList.add('hidden');
    }
}

// Close menu when clicking outside
document.addEventListener('click', function(event) {
    const container = document.getElementById('user-menu-container');
    const button = document.getElementById('user-menu-button');
    const dropdown = document.getElementById('user-menu-dropdown');
    
    if (container && !container.contains(event.target)) {
        dropdown.classList.add('hidden');
        userMenuOpen = false;
    }
});
</script>
