<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Gym Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-teal-50 via-white to-emerald-50 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-2xl p-8 w-full max-w-md border border-teal-100">
        <div class="text-center mb-8">
            <div class="flex items-center justify-center mb-4">
                <span class="text-4xl">🏋️</span>
            </div>
            <h1 class="text-3xl font-bold text-teal-900 mb-2">Admin Login</h1>
            <p class="text-teal-600">Gym Finder Admin Panel</p>
        </div>
        
        {% if error %}
        <div class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg mb-6">
            {{ error }}
        </div>
        {% endif %}
        
        <form method="POST" action="/admin/login" class="space-y-6">
            <div>
                <label for="email" class="block text-sm font-medium text-teal-700 mb-2">Email</label>
                <input type="email" id="email" name="email" required autofocus
                    class="w-full px-4 py-3 border border-teal-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
            </div>
            
            <div>
                <label for="password" class="block text-sm font-medium text-teal-700 mb-2">Password</label>
                <input type="password" id="password" name="password" required
                    class="w-full px-4 py-3 border border-teal-200 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-teal-500 transition">
            </div>
            
            <button type="submit" 
                class="w-full bg-gradient-to-r from-teal-600 to-emerald-600 text-white py-3 rounded-lg font-semibold hover:from-teal-700 hover:to-emerald-700 transition duration-200 shadow-lg">
                Login
            </button>
        </form>
    </div>
</body>
</html>
